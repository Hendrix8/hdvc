hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - task=qinco_aq_faiss_compute_distances
    - cpu=True
    - output=/tmp/qinco_gist40_4096_repro.npz
    - qinco_aq_codebooks=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/compressed_qinco_res/unzip/gist_M_40_K_4096/setting_0/encode_train/setting_0/train_qinco_aq/setting_0/train_qinco_aq_setting_0.npz
    - encoded_db=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/compressed_qinco_res/unzip/gist_M_40_K_4096/setting_0/encode_test/setting_0/encode_test_setting_0_0-9999.npz
    - db=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/.adc_data_symlinks/gist/gist_base.fvecs
    - queries=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/.adc_data_symlinks/gist/gist_query.fvecs
    - ds.db=10000
    - ds.query=2
  job:
    name: run
    chdir: null
    override_dirname: cpu=True,db=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/.adc_data_symlinks/gist/gist_base.fvecs,ds.db=10000,ds.query=2,encoded_db=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/compressed_qinco_res/unzip/gist_M_40_K_4096/setting_0/encode_test/setting_0/encode_test_setting_0_0-9999.npz,output=/tmp/qinco_gist40_4096_repro.npz,qinco_aq_codebooks=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/compressed_qinco_res/unzip/gist_M_40_K_4096/setting_0/encode_train/setting_0/train_qinco_aq/setting_0/train_qinco_aq_setting_0.npz,queries=/mnthdd/cpanourg/2-hdvc/results/urania_results/results/qinco2/.adc_data_symlinks/gist/gist_query.fvecs,task=qinco_aq_faiss_compute_distances
    id: ???
    num: ???
    config_name: qinco_cfg
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/cpanourg/projects/2-hdvc
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/cpanourg/projects/2-hdvc/Qinco2/config
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/cpanourg/projects/2-hdvc/outputs/2026-05-10/23-08-49
    choices:
      model_args: null
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
